                            return;

                                <h4 className="text-sm font-black text-white uppercase tracking-wider">Казначейский Руководитель по Бюджету 2026</h4>
                                
                                <p className="text-slate-300 text-xs font-semibold leading-relaxed">
                                    Этот ассистент настроен на официальный закон о социально-экономическом планировании Москвы. В нем содержатся все статьи поступлений, налоговые ставки и лимиты.
                                </p>

                                <div className="space-y-2.5 pt-2">
                                    <div className="p-3 bg-neutral-900 border border-neutral-850 rounded-xl">
                                        <span className="text-[8px] uppercase font-bold text-amber-400 block tracking-wider leading-none">Главный совет</span>
                                        <span className="text-[11px] font-bold text-slate-100 block leading-normal mt-1">
                                            Напишите ключевое слово <strong className="text-white bg-red-700 px-1 py-0.2 rounded font-mono font-extrabold shadow-3xs">викторина</strong>, и ИИ моментально сгенерирует для вас интерактивный тест из 3 вопросов!
                                        </span>
                                    </div>

                                    <div className="p-3 bg-neutral-900 border border-neutral-850 rounded-xl text-[11px] space-y-1.5">
                                        <span className="text-[8px] uppercase font-semibold text-slate-400 block tracking-wider leading-none">Ограничения и лимиты</span>
                                        <div className="flex justify-between text-slate-300 font-mono font-bold leading-tight border-b border-neutral-800 pb-1">
                                            <span>Вычет на личную учебу</span><span className="text-white">150 000 ₽</span>
                                        </div>
                                        <div className="flex justify-between text-slate-300 font-mono font-bold leading-tight border-b border-neutral-805 pb-1">
                                            <span>Вычет на обучение детей</span><span className="text-white">110 000 ₽</span>
                                        </div>
                                        <div className="flex justify-between text-slate-300 font-mono font-bold leading-tight">
                                            <span>Налог на прибыль ОЭЗ</span><span className="text-white">0% (10 лет)</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="pt-4 border-t border-neutral-800 mt-4">
                                <span className="text-[8px] uppercase font-black tracking-widest text-[#B5C2D9] block">ИНТЕГРАЦИЯ С МОДУЛЯМИ</span>
                                <p className="text-[10px] text-slate-400 font-semibold leading-relaxed mt-1">
                                    Прохождение сгенерированной викторины добавит <span className="text-emerald-400 font-bold">+150 Б</span> по всей системе!
                                </p>
                            </div>
                        </div>

                    </div>

                </div>
            );
        };


        // =============================================================
        //  GRAND UNIFIED APPLICATION TESTBED
        // =============================================================
        const TestbedApp = () => {
            const [selectedPersona, setSelectedPersona] = useState('Student');
            const [calculatedNdfl, setCalculatedNdfl] = useState(50000);

            // Tab Switching Core state
            const [activeAppTab, setActiveAppTab] = useState('map');

            // Shared Quiz states triggered by AI Assistant (Block 4) and Quiz Section (Block 3)
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [score, setScore] = useState(0);

            // Gamified global tracker
            const [completedActivities, setCompletedActivities] = useState(() => {
                try {
                    const saved = localStorage.getItem('mos_completed_activities');
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });

            const [totalScore, setTotalScore] = useState(() => {
                try {
                    const saved = localStorage.getItem('mos_total_score');
                    return saved ? parseInt(saved, 10) || 0 : 0;
                } catch {
                    return 0;
                }
            });

            const [unlockedNfts, setUnlockedNfts] = useState(() => {
                try {
                    const saved = localStorage.getItem('mos_unlocked_nfts');
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });

            // Mayor parameters (so they persist across sub-tab jumps seamlessly!)
            const [selectedMayorDistrict, setSelectedMayorDistrict] = useState('tverskoy');
            const [mayorEducation, setMayorEducation] = useState(30);
            const [mayorTransport, setMayorTransport] = useState(40);
            const [mayorHealthcare, setMayorHealthcare] = useState(30);
            const [simulationReport, setSimulationReport] = useState(null);

            // Sync sliders default on district switch
            useEffect(() => {
                const activeD = MAYOR_DISTRICTS.find(x => x.id === selectedMayorDistrict) || MAYOR_DISTRICTS[0];
                const portion = Math.floor(activeD.budget / 3);
                setMayorEducation(portion);
                setMayorTransport(portion);
                setMayorHealthcare(portion);
                setSimulationReport(null);
            }, [selectedMayorDistrict]);

            const [selectedMapDistrictId, setSelectedMapDistrictId] = useState('tverskoy');

            // Global Toast State
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            };

            useEffect(() => {
                if (toast) {
                    const timer = setTimeout(() => setToast(null), 4000);
                    return () => clearTimeout(timer);
                }
            }, [toast]);

            const handleCompleteActivity = (id, points, msg) => {
                if (completedActivities.includes(id)) {
                    showToast("Это задание уже пройдено, но показатели симуляции обновлены!", "info");
                    return;
                }
                const nextList = [...completedActivities, id];
                setCompletedActivities(nextList);
                localStorage.setItem('mos_completed_activities', JSON.stringify(nextList));

                const nextScore = totalScore + points;
                setTotalScore(nextScore);
                localStorage.setItem('mos_total_score', nextScore.toString());

                showToast(`${msg} Получено +${points} баллов!`, "success");
            };

            const userLevel = Math.floor(totalScore / 150) + 1;

            return (
                <div className="min-h-screen bg-[#F8FAFC] pb-10 flex flex-col items-center">
                    
                    {/* Floating Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 animate-pop max-w-sm">
                            <div className={cn(
                                "p-4 rounded-xl shadow-lg border text-xs font-bold leading-relaxed flex items-center gap-3",
                                toast.type === 'success' ? "bg-emerald-50 border-emerald-300 text-emerald-950" :
                                toast.type === 'warning' ? "bg-amber-50 border-amber-300 text-amber-950" :
                                "bg-[#1E293B] border-neutral-800 text-white"
                            )}>
                                <span>{toast.type === 'success' ? "🎉" : "💡"}</span>
                                <p>{toast.message}</p>
                            </div>
                        </div>
                    )}

                    <div className="w-full max-w-6xl px-4 sm:px-6 lg:px-8 space-y-6 pt-5">
                        
                        {/* HEADER DASHBOARD STAT BAR */}
                        <div className="bg-white border border-slate-200/85 shadow-xs rounded-3xl p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-5">
                            
                            <div className="flex items-center gap-3.5">
                                <div className="p-3 bg-red-100 text-[#CC1111] rounded-2xl font-black text-xl border border-rose-200">М</div>
                                <div>
                                    <span className="text-[9px] uppercase font-black bg-rose-50 border border-rose-200 text-[#CC1111] px-2 py-0.5 rounded tracking-widest leading-none block w-max">
                                        Standalone Блоки 1-3
                                    </span>
                                    <h1 className="text-slate-950 text-base sm:text-xl font-black tracking-tight mt-1 leading-none">Портал «МосГорБюджет.Трек»</h1>
                                    <span className="text-[10px] text-slate-400 block mt-0.5 font-medium">Сборка квизов, игр, карт и симулятора мэра успешно завершена</span>
                                </div>
                            </div>

                            {/* Live metrics widgets */}
                            <div className="flex flex-wrap items-center gap-3.5">
                                <div className="bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-center leading-none">
                                    <span className="text-[8px] uppercase font-black text-slate-400 tracking-wider block mb-1">Статус Уровня</span>
                                    <span className="text-xs sm:text-sm font-black text-slate-800">Уровень {userLevel} (XP)</span>
                                </div>
                                <div className="bg-red-50/55 border border-red-200 px-4 py-2 rounded-xl text-center leading-none">
                                    <span className="text-[8px] uppercase font-black text-[#CC1111] tracking-wider block mb-1">Всего Баллов Б</span>
                                    <span className="text-xs sm:text-sm font-black text-[#CC1111] font-mono">{totalScore} Б</span>
                                </div>
                                <div className="bg-emerald-50 border border-emerald-200 px-4 py-2 rounded-xl text-center leading-none">
                                    <span className="text-[8px] uppercase font-black text-emerald-800 tracking-wider block mb-1">Рекордов знаков</span>
                                    <span className="text-xs sm:text-sm font-black text-emerald-800 font-mono">{unlockedNfts.length} знаков</span>
                                </div>
                            </div>

                        </div>

                        {/* SUB-TABS JUMPER NAVIGATION */}
                        <div className="border border-slate-200 bg-white p-2 rounded-2xl flex flex-wrap gap-1 items-center shadow-xs">
                            {[
                                { id: 'map', label: 'Карта Москвы 🗺️' },
                                { id: 'mayor', label: 'Кабинет Мэра 👑' },
                                { id: 'quiz', label: 'Викторины 📝' },
                                { id: 'assistant', label: 'ИИ-Помощник 🤖' },
                                { id: 'minigames', label: 'Мини-Игры 🎮' },
                                { id: 'specials', label: 'Спецзадачи ⭐' },
                                { id: 'checkup', label: 'Финансовый Чекап 📊' }
                            ].map((tab) => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveAppTab(tab.id)}
                                    className={cn(
                                        "px-4.5 py-2.5 rounded-xl text-xs font-extrabold transition-all duration-150 cursor-pointer select-none",
                                        activeAppTab === tab.id 
                                            ? "bg-slate-900 text-white shadow-xs scale-[1.01]" 
                                            : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"
                                    )}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        {/* DISPLAY ZONE */}
                        <div className="space-y-6">
                            {activeAppTab === 'map' && (
                                <CityMapSection 
                                    selectedMapDistrictId={selectedMapDistrictId}
                                    setSelectedMapDistrictId={setSelectedMapDistrictId}
                                    activeAppTab={activeAppTab}
                                    setActiveAppTab={setActiveAppTab}
                                    selectedMayorDistrict={selectedMayorDistrict}
                                    setSelectedMayorDistrict={setSelectedMayorDistrict}
                                    unlockedNfts={unlockedNfts}
                                    setSimulationReport={setSimulationReport}
                                />
                            )}

                            {activeAppTab === 'mayor' && (
                                <VirtualMayorSection 
                                    completedActivities={completedActivities}
                                    handleCompleteActivity={handleCompleteActivity}
                                    showToast={showToast}
                                    selectedMayorDistrict={selectedMayorDistrict}
                                    setSelectedMayorDistrict={setSelectedMayorDistrict}
                                    unlockedNfts={unlockedNfts}
                                    setUnlockedNfts={setUnlockedNfts}
                                    mayorEducation={mayorEducation}
                                    setMayorEducation={setMayorEducation}
                                    mayorTransport={mayorTransport}
                                    setMayorTransport={setMayorTransport}
                                    mayorHealthcare={mayorHealthcare}
                                    setMayorHealthcare={setMayorHealthcare}
                                    simulationReport={simulationReport}
                                    setSimulationReport={setSimulationReport}
                                />
                            )}

                            {activeAppTab === 'quiz' && (
                                <QuizSection 
                                    completedActivities={completedActivities}
                                    handleCompleteActivity={handleCompleteActivity}
                                    showToast={showToast}
                                    activeQuiz={activeQuiz}
                                    setActiveQuiz={setActiveQuiz}
                                    currentQuestionIndex={currentQuestionIndex}
                                    setCurrentQuestionIndex={setCurrentQuestionIndex}
                                    selectedOption={selectedOption}
                                    setSelectedOption={setSelectedOption}
                                    score={score}
                                    setScore={setScore}
                                />
                            )}

                            {activeAppTab === 'assistant' && (
                                <AIAssistantSection 
                                    setActiveAppTab={setActiveAppTab}
                                    activeQuiz={activeQuiz}
                                    setActiveQuiz={setActiveQuiz}
                                    setCurrentQuestionIndex={setCurrentQuestionIndex}
                                    setSelectedOption={setSelectedOption}
                                    setScore={setScore}
                                    showToast={showToast}
                                />
                            )}

                            {activeAppTab === 'minigames' && (
                                <MinigamesSection 
                                    completedActivities={completedActivities}
                                    handleCompleteActivity={handleCompleteActivity}
                                    showToast={showToast}
                                />
                            )}

                            {activeAppTab === 'specials' && (
                                <SpecialsSection 
                                    completedActivities={completedActivities}
                                    handleCompleteActivity={handleCompleteActivity}
                                    showToast={showToast}
                                />
                            )}

                            {activeAppTab === 'checkup' && (
                                <div className="space-y-6">
                                    <PersonaSelector activePersona={selectedPersona} onSelect={setSelectedPersona} />

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">
                                        <TaxCalculator activePersona={selectedPersona} onCalculate={setCalculatedNdfl} />
                                        
                                        <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs flex flex-col justify-between">
                                            <div className="space-y-3.5">
                                                <h4 className="font-extrabold text-slate-900 text-sm flex items-center gap-1.5 flex-wrap">
                                                    <span className="text-amber-500">⚡</span>
                                                    <span>Как взаимодействуют модули?</span>
                                                </h4>
                                                <p className="text-xs text-slate-500 font-semibold leading-relaxed">
                                                    Изменяя социальный статус (**Студент**, **Специалист**, **Предприниматель**, **Семья**), калькулятор налогов адаптирует лимиты и коэффициенты возврата.
                                                </p>
                                                <p className="text-xs text-slate-500 font-semibold leading-relaxed">
                                                    Нажмите **«Рассчитать возврат»** в калькуляторе справа — калькулятор спроецирует НДФЛ и передаст эти показатели в **Кольцо расходов** ниже. Переключите режим на **«Мой вклад НДФЛ»**, чтобы увидеть, куда персонально направляются ваши рубли!
                                                </p>
                                            </div>
                                            <div className="pt-3 border-t border-slate-100 flex justify-between items-center text-xs font-black flex-wrap gap-2">
                                                <span className="text-slate-400 font-bold uppercase tracking-wider text-[8px]">персональный вклад</span>
                                                <span className="font-mono text-[#CC1111]">{new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(calculatedNdfl)}/год</span>
                                            </div>
                                        </div>
                                    </div>

                                    <AnalyticsChart externalPersonalTax={calculatedNdfl} />
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        };

        // Standard root node mounting
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TestbedApp />);
    </script>
</body>
</html>
